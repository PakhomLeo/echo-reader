[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "echo-reader-tools"
version = "0.1.0"
description = "Integration tools for the Echo reader and MediaLab content producer"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.116,<1",
    "httpx>=0.27,<1",
    "medialab[bridge,cloud,render]",
    "uvicorn>=0.35,<1",
]

[project.scripts]
echo-reader-import = "echo_reader.cli:main"
echo-reader-service = "echo_reader.server:main"
echo-reader-desktop = "echo_reader.desktop:main"

[dependency-groups]
dev = [
    "pytest>=9,<10",
]
package = [
    "pyinstaller==6.21.0",
]

[project.optional-dependencies]
local-asr = ["medialab[local-asr]"]
funasr = ["medialab[funasr]"]
render = ["medialab[render]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
medialab = { workspace = true }

[tool.uv.workspace]
members = ["components/medialab"]
