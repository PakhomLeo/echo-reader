<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'Noto Sans SC', sans-serif">
  <title id="t">Echo Reader architecture</title>
  <desc id="d">Browser talks to the loopback Rust gateway, which serves the React reader, the reader API and search, and proxies an allow-list of import routes to the private Python import service. The import service drives MediaLab, which writes items into the library folder. Optional Chrome extension, cloud services and local models are shown at the edges.</desc>
  <style>
    .bg{fill:#ffffff}
    .box{fill:#f6f8fa;stroke:#57606a;stroke-width:1.5}
    .acc{fill:#ddf4ff;stroke:#0969da;stroke-width:1.5}
    .grn{fill:#dafbe1;stroke:#1a7f37;stroke-width:1.5}
    .opt{fill:#fff8c5;stroke:#9a6700;stroke-width:1.5;stroke-dasharray:6 4}
    .zone{fill:none;stroke:#8c959f;stroke-width:1.2;stroke-dasharray:4 4}
    .h{fill:#1f2328;font-size:15px;font-weight:600}
    .s{fill:#59636e;font-size:12px}
    .z{fill:#59636e;font-size:12px;font-style:italic}
    .ln{stroke:#57606a;stroke-width:1.6;fill:none}
    .lo{stroke:#9a6700;stroke-width:1.4;fill:none;stroke-dasharray:5 4}
    .lb{fill:#59636e;font-size:11px}
    .ah{fill:#57606a}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1117}
      .box{fill:#161b22;stroke:#8b949e}
      .acc{fill:#0c2d6b;stroke:#4493f8}
      .grn{fill:#0f3a1e;stroke:#3fb950}
      .opt{fill:#3b2e00;stroke:#d29922}
      .zone{stroke:#6e7681}
      .h{fill:#e6edf3}
      .s,.z,.lb{fill:#9198a1}
      .ln{stroke:#8b949e}
      .lo{stroke:#d29922}
      .ah{fill:#8b949e}
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="bg" width="960" height="560" rx="12"/>

  <rect class="zone" x="200" y="20" width="560" height="520" rx="12"/>
  <text class="z" x="215" y="40">your computer · loopback only (127.0.0.1)</text>

  <!-- Browser -->
  <rect class="box" x="20" y="70" width="160" height="80" rx="10"/>
  <text class="h" x="100" y="102" text-anchor="middle">Browser</text>
  <text class="s" x="100" y="122" text-anchor="middle">React reader UI</text>
  <text class="s" x="100" y="138" text-anchor="middle">session cookie (desktop)</text>

  <!-- Chrome extension -->
  <rect class="opt" x="20" y="300" width="160" height="80" rx="10"/>
  <text class="h" x="100" y="330" text-anchor="middle">Chrome extension</text>
  <text class="s" x="100" y="350" text-anchor="middle">Session Bridge</text>
  <text class="s" x="100" y="366" text-anchor="middle">optional · your logins</text>

  <!-- Gateway -->
  <rect class="acc" x="240" y="60" width="300" height="130" rx="10"/>
  <text class="h" x="390" y="88" text-anchor="middle">Echo gateway (Rust · Axum)</text>
  <text class="s" x="390" y="110" text-anchor="middle">serves React app · /api/v1 reader API</text>
  <text class="s" x="390" y="128" text-anchor="middle">media &amp; assets · SQLite FTS5 search</text>
  <text class="s" x="390" y="146" text-anchor="middle">Host / Origin checks · session cookie</text>
  <text class="s" x="390" y="164" text-anchor="middle">allow-listed proxy to import routes</text>

  <!-- Import service -->
  <rect class="acc" x="240" y="250" width="300" height="130" rx="10"/>
  <text class="h" x="390" y="278" text-anchor="middle">Import service (Python · FastAPI)</text>
  <text class="s" x="390" y="300" text-anchor="middle">batches · jobs · timeline (imports.db)</text>
  <text class="s" x="390" y="318" text-anchor="middle">read-aloud &amp; OCR enrichment jobs</text>
  <text class="s" x="390" y="336" text-anchor="middle">internal token (desktop) · SessionBridge :19876</text>
  <text class="s" x="390" y="354" text-anchor="middle">library switch · rescan</text>

  <!-- MediaLab -->
  <rect class="acc" x="240" y="420" width="300" height="100" rx="10"/>
  <text class="h" x="390" y="448" text-anchor="middle">MediaLab (Python library)</text>
  <text class="s" x="390" y="470" text-anchor="middle">probe · yt-dlp download · article extraction</text>
  <text class="s" x="390" y="488" text-anchor="middle">ASR + quality gate · atomic publish</text>
  <text class="s" x="390" y="506" text-anchor="middle">medialab.db</text>

  <!-- Library -->
  <rect class="grn" x="580" y="60" width="160" height="200" rx="10"/>
  <text class="h" x="660" y="88" text-anchor="middle">Library folder</text>
  <text class="s" x="660" y="108" text-anchor="middle">single source of truth</text>
  <text class="s" x="660" y="136" text-anchor="middle">item/manifest.json</text>
  <text class="s" x="660" y="154" text-anchor="middle">article.md</text>
  <text class="s" x="660" y="172" text-anchor="middle">transcript.json</text>
  <text class="s" x="660" y="190" text-anchor="middle">images/ · media/</text>
  <text class="s" x="660" y="208" text-anchor="middle">ocr.json</text>
  <text class="s" x="660" y="236" text-anchor="middle">(plain files you own)</text>

  <!-- Local models -->
  <rect class="opt" x="580" y="300" width="160" height="90" rx="10"/>
  <text class="h" x="660" y="326" text-anchor="middle">Local models</text>
  <text class="s" x="660" y="346" text-anchor="middle">Whisper · Fun-ASR-Nano</text>
  <text class="s" x="660" y="362" text-anchor="middle">Kokoro TTS · RapidOCR</text>
  <text class="s" x="660" y="378" text-anchor="middle">optional extras</text>

  <!-- External -->
  <rect class="opt" x="790" y="230" width="150" height="130" rx="10"/>
  <text class="h" x="865" y="260" text-anchor="middle">Cloud services</text>
  <text class="s" x="865" y="282" text-anchor="middle">opt-in only</text>
  <text class="s" x="865" y="302" text-anchor="middle">DashScope ASR + OSS</text>
  <text class="s" x="865" y="320" text-anchor="middle">LLM clean-up</text>
  <text class="s" x="865" y="338" text-anchor="middle">PaddleOCR-VL API</text>

  <rect class="box" x="790" y="430" width="150" height="90" rx="10"/>
  <text class="h" x="865" y="460" text-anchor="middle">Websites</text>
  <text class="s" x="865" y="480" text-anchor="middle">articles · videos</text>
  <text class="s" x="865" y="496" text-anchor="middle">HTTPS · public IPs only</text>

  <!-- arrows -->
  <path class="ln" d="M180,110 L238,110" marker-end="url(#a)"/>
  <text class="lb" x="190" y="102">HTTP</text>
  <path class="ln" d="M390,190 L390,248" marker-end="url(#a)"/>
  <text class="lb" x="398" y="224">proxy /api/v1/import-*</text>
  <path class="ln" d="M360,248 L360,192" marker-end="url(#a)"/>
  <text class="lb" x="262" y="224">rescan / switch</text>
  <path class="ln" d="M390,380 L390,418" marker-end="url(#a)"/>
  <path class="ln" d="M540,125 L578,125" marker-end="url(#a)"/>
  <text class="lb" x="546" y="50">scan · read · edit</text>
  <path class="ln" d="M540,440 L560,440 L560,240 L578,240" marker-end="url(#a)"/>
  <text class="lb" x="500" y="412">publish</text>
  <path class="ln" d="M540,340 L578,340" marker-end="url(#a)"/>
  <path class="ln" d="M540,475 L620,475 L620,392" marker-end="url(#a)"/>
  <path class="ln" d="M540,505 L788,505" marker-end="url(#a)"/>
  <text class="lb" x="640" y="498">fetch / download</text>
  <path class="lo" d="M540,455 L770,455 L770,300 L788,300" marker-end="url(#a)"/>
  <path class="lo" d="M180,340 L238,330" marker-end="url(#a)"/>
  <text class="lb" x="186" y="360">cookies (WS)</text>
</svg>
