# separate DLLs that users can replace. Do not switch to a "-gpl" asset: see THIRD_PARTY_NOTICES.md.
[tools."github:BtbN/FFmpeg-Builds"]
version = "autobuild-2026-07-31-14-10"

[tools."github:BtbN/FFmpeg-Builds".platforms]
windows-x64 = { asset_pattern = "ffmpeg-n8.1.2-34-g9b6c8969e0-win64-lgpl-shared-8.1.zip", checksum = "sha256:c222a490dde4e7059f45495deef6bfb98dbcacc2b43df5b607546252037aa95c" }
linux-x64 = { asset_pattern = "ffmpeg-n8.1.2-34-g9b6c8969e0-linux64-lgpl-8.1.tar.xz", checksum = "sha256:8c8b2897f2a8093ae2d985f7f1867d218451d4c567c1b2437f86a7c73a950b9f" }
