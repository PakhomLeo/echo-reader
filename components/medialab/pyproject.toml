[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "medialab"
version = "0.1.0"
description = "In-process media download and ASR pipeline library"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "yt-dlp==2026.7.4",
    "yt-dlp-ejs>=0.8",
    "httpx>=0.27",
    "trafilatura>=2.0",
    "cssselect>=1.2",
    "curl-cffi==0.15.0",
]

[project.optional-dependencies]
cloud = ["oss2>=2.19"]
render = ["playwright>=1.54,<2"]
# websocket-server 固定已验证版本：bridge.py 依赖其私有 API（0.6.4 行为）
bridge = ["websocket-server==0.6.4", "websocket-client>=1.8"]
funasr = [
    "funasr>=1.4,<2",
    "modelscope>=1.10",
    "torch>=2.2,<3",
    "torchaudio>=2.2,<3",
]
# 可选：Kokoro 离线朗读（模型需另行下载，见 scripts/download_kokoro_models.py）
tts = [
    "kokoro-onnx==0.5.0",
    "onnxruntime>=1.20,<2",
    "numpy>=2,<3",
]
# 可选：本地图片文字识别（PP-OCR ONNX 模型随 wheel 提供）
ocr = ["rapidocr-onnxruntime==1.4.4"]
local-asr = [
    "huggingface-hub>=1.3,<2",
    "numpy>=2.3,<3",
    "openvino-genai>=2026.0,<2027",
    "sherpa-onnx==1.13.3",
    "sherpa-onnx-core==1.13.3",
]


[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
medialab = ["config/*.toml"]
