[package]
name = "echo-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = "0.13"
blake3 = "1"
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
mime_guess = "2"
uuid = { version = "1", features = ["v4"] }
mime = "0.3.17"
tokio-util = { version = "0.7.19", features = ["io"] }
chrono = { version = "0.4.45", features = ["clock"] }
percent-encoding = "2.3.2"
reqwest = { version = "0.13.4", default-features = false }
socket2 = "0.6.5"
rusqlite = { version = "0.37", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_System_Threading"] }

[dev-dependencies]
reqwest = { version = "0.13.4", features = ["json", "multipart"] }
